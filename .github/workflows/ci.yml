name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Runs first and independently of everything else. This repository is private
  # today and is intended to go public; a credential committed once is in the
  # pack forever, and the window to rewrite history cheaply closes the moment
  # someone clones it.
  #
  # fetch-depth: 0 is load-bearing. The default shallow checkout fetches one
  # commit, so the scan would pass by only ever looking at the tip -- a green
  # check describing a scan that did not happen, which is the failure mode this
  # project keeps cataloguing.
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install trufflehog3
      - name: Scan every commit, not just the working tree
        run: trufflehog3 --no-current --depth 10000 --config .trufflehog3.yml .

  # Fast feedback. No data, no credentials, so a fork PR gets a useful answer
  # in under a minute.
  lint:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 here for the same reason it is on the secret scan, with
      # the sign flipped. test_referenced_commits_exist.py resolves every commit
      # SHA cited in tracked prose; under the default shallow checkout those
      # lookups fail against a history that was never fetched, and the failure
      # reads "these commits do not exist" -- sending the reader after a
      # dangling reference that is perfectly healthy. The repository is ~49 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff
        run: |
          ruff check analytics dashboard enrichment ingestion orchestration scripts
          ruff format --check analytics dashboard enrichment ingestion orchestration scripts
      # BEFORE the tests, not after. `dbt parse` needs no data and no warehouse
      # -- it writes target/manifest.json from the project files alone -- and
      # the architecture diagram tests read that manifest. Running it afterwards
      # left them with no manifest in the fast job, where they used to skip, and
      # a skip is a pass. Ordering is the fix; making them fail loudly without a
      # manifest only surfaced the problem.
      - name: dbt parse
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt parse

      - name: Unit tests
        # enrichment/tests run here on purpose: the whole pipeline except the
        # HTTP call is exercised offline, so CI needs no Gemini key.
        run: python -m pytest analytics/tests ingestion/tests enrichment/tests dashboard/tests -q
      # `make` is installed on the runner but not on the development machine, so
      # these recipes had only ever been read. -n expands and prints them without
      # executing, which catches a mangled line continuation or a typo'd variable
      # -- both of which had already happened and gone unnoticed.
      - name: Makefile recipes expand
        run: make -n help lint test profile spend dashboard-deploy-check secrets embed embed-reconcile readme readme-check taxonomy-seed taxonomy-seed-check demo-examples embedding-cost eval-score replay backfill verify-slices load-static validate-bq snapshot enrich enrich-export enrich-restore gemini-check dag-run diagram screenshot

  # The real gate: every model built and every test run against DuckDB, which
  # reads the CSVs in place. No warehouse, no cloud credentials, no spend -- the
  # whole pipeline is verified on free CI minutes.
  #
  # Deliberately no test count here. This comment said 67 while the README said
  # 68 and dbt reported 55; a number in a place nothing generates is a number
  # that will drift.
  build:
    name: dbt build (duckdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Cache the Olist dataset
        id: cache-data
        uses: actions/cache@v4
        with:
          path: archive
          key: olist-dataset-v1

      - name: Download dataset
        if: steps.cache-data.outputs.cache-hit != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle
          python scripts/download_data.py

      # The marts read a dbt source backed by the committed enrichment Parquet,
      # added in 5e16d59. CI never restored it, so every build since has failed
      # six tests on "Table with name olist_raw.review_enrichment does not
      # exist". Free and keyless -- it is a local Parquet load, which is the
      # whole point of committing the snapshot.
      - name: Restore the enrichment snapshot
        run: python scripts/export_enrichment.py --duckdb-path transform/olist.duckdb --restore

      - name: dbt build
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt build --target duckdb

      # Every figure in the README comes from profile_dataset.py. If the data
      # or the normalization changes and the committed doc/seed were not
      # regenerated, fail rather than let the documentation drift into fiction.
      - name: Assert documented figures are current
        run: |
          python scripts/profile_dataset.py
          git diff --exit-code docs/data_profiling.md docs/figures.json transform/seeds/normalization_parity.csv \
            || (echo "::error::Generated files are stale. Run 'make profile' and commit." && exit 1)

      # The README is rendered from those figures, so a stale README is one whose
      # numbers disagree with the data. This is the gate that would have caught
      # 611 -> 603 drifting to 611 -> 604, and the test count claiming 68 where dbt
      # reports 55.
      - name: Assert README matches the measured figures
        run: python scripts/render_readme.py --check

      # The aspect seed is a rendering of enrichment/taxonomy.py. A hand-edited
      # copy of the aspect list in SQL is the exact failure this project keeps
      # finding, so drift between them fails the build rather than waiting to be
      # noticed in a mart that quietly lost an aspect.
      - name: Assert the aspect seed matches the taxonomy
        run: python scripts/export_taxonomy_seed.py --check

      # The architecture diagram, checked HERE rather than in the unit-test job,
      # because that job runs before anything builds and the manifest would be
      # absent -- so the check would report green by never running, which is the
      # failure mode the diagram test is itself about. The fixture refuses to skip
      # when CI is set, so if this ever runs without a manifest it fails loudly
      # instead of passing quietly.
      - name: Assert the architecture diagram matches the built project
        run: python -m pytest analytics/tests/test_architecture_diagram.py -q

      # Both artifacts the DEPLOYED app depends on and the repo does not: the
      # cached answers and the frozen schema prompt. Neither is reachable from a
      # clone otherwise -- target/ is gitignored build output -- so drift here is
      # invisible until someone types a question into the deployed demo.
      - name: Assert the deployed demo's artifacts are current
        run: |
          python scripts/export_demo_examples.py
          python scripts/export_agent_schema.py
          git diff --stat --exit-code dashboard/data/demo_examples.json dashboard/data/agent_schema.json \
            || echo "::warning::deployed-demo artifacts differ; run 'make dashboard-deploy-check' and commit"

      - name: Assert dashboard snapshot is current
        run: |
          python scripts/export_snapshot.py
          git diff --stat --exit-code dashboard/data/ \
            || echo "::warning::dashboard snapshot differs; run 'make snapshot' and commit"

      # The docs site is generated from the SAME build that just ran its tests,
      # in the same job, rather than by a workflow that rebuilds independently.
      # A second build is a second answer: the published catalogue would describe
      # a run nothing else in this file verified, and the two could disagree
      # without anything noticing. It also reuses the cached dataset instead of
      # downloading 123 MB twice.
      #
      # --target duckdb on purpose: the catalogue's column types and row counts
      # come from querying the warehouse, and this one is built from the CSVs on
      # free CI minutes with no credentials.
      - name: Generate dbt docs
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: dbt docs generate --target duckdb

      # dbt's docs site is three files that must sit together. Copying exactly
      # these rather than publishing target/ wholesale: that directory also holds
      # run_results.json and the compiled SQL, and none of it belongs on a public
      # URL just because it happened to be in the build directory.
      - name: Assemble the docs site
        run: |
          mkdir -p site
          cp transform/target/index.html site/
          cp transform/target/manifest.json site/
          cp transform/target/catalog.json site/
          test -s site/index.html && test -s site/catalog.json

      - name: Upload the docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: transform/target/
          retention-days: 7

  # Airflow is a heavy install, so it gets its own job and does not slow the
  # main gate. Proves the DAGs import and keep their schedule invariants.
  dags:
    name: DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # The Airflow version is read from the requirements file rather than
      # repeated here. It was repeated, and a second copy of a version is a
      # second thing to forget to bump.
      - name: Install Airflow against the official constraints
        run: |
          AIRFLOW_VERSION=$(sed -n 's/^apache-airflow==//p' orchestration/requirements-airflow.txt)
          echo "Resolving against Airflow ${AIRFLOW_VERSION} constraints"
          pip install -r orchestration/requirements-airflow.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ env.PYTHON_VERSION }}.txt"
          pip install pytest
      # AIRFLOW_HOME and a migrated metadata DB are both required: DagBag in
      # Airflow 3 reaches for the database, and without them every test failed
      # with "sqlite3.OperationalError: unable to open database file". The job had
      # never got this far before -- it was failing at the install step -- so this
      # was the next thing waiting to be discovered.
      - name: DAG integrity tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: |
          airflow db migrate
          python -m pytest orchestration/tests -q

  # Publish the dbt docs. Separate job because Pages deployment needs elevated
  # permissions and its own concurrency group, and because it must not run on a
  # pull request: a PR deploying to the live URL would publish an unreviewed
  # catalogue over the one on main.
  #
  # It deploys the artifact the build job produced rather than regenerating it,
  # so the published site is the same build whose tests passed above.
  pages:
    name: Publish dbt docs
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
