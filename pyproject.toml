[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"orchestration/dags/*" = ["E402"]  # Airflow DAG files import after module docstring/config

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["analytics/tests", "ingestion/tests"]
