version: 2

seeds:
  - name: normalization_parity
    description: |
      Every distinct location string in the source with its Python-normalized
      form, generated by `make profile`. Reference data for
      assert_normalize_macro_matches_python, which proves the SQL macro and
      the Python helper cannot drift apart unnoticed.
    config:
      column_types:
        source_column: varchar
        raw_value: varchar
        python_normalized: varchar
    columns:
      - name: raw_value
        data_tests: [not_null]
