version: 2

sources:
  - name: olist_raw
    description: >
      Brazilian E-Commerce Public Dataset by Olist (Kaggle, CC BY-NC-SA 4.0).
      On duckdb the CSVs are read in place via external_location; on bigquery
      the same table names resolve to the landed raw dataset.
    meta:
      external_location: "read_csv_auto('{{ env_var('OLIST_RAW_DIR', '../archive') }}/{name}.csv', header=true, sample_size=-1)"
    schema: "{{ env_var('BQ_RAW_DATASET', 'olist_raw') }}"
    tables:
      - name: olist_customers_dataset
        description: One row per order-scoped customer_id. NOT a customer master.
        columns:
          - name: customer_id
            description: Order-scoped surrogate. Unique per row, never repeats.
            data_tests: [unique, not_null]
          - name: customer_unique_id
            description: The true person-level key, one per person.
            data_tests: [not_null]
      - name: olist_orders_dataset
        columns:
          - name: order_id
            data_tests: [unique, not_null]
          - name: customer_id
            data_tests: [unique, not_null]
      - name: olist_order_items_dataset
      - name: olist_order_payments_dataset
      - name: olist_order_reviews_dataset
      - name: olist_products_dataset
        columns:
          - name: product_id
            data_tests: [unique, not_null]
      - name: olist_sellers_dataset
        columns:
          - name: seller_id
            data_tests: [unique, not_null]
      - name: olist_geolocation_dataset
      - name: product_category_name_translation

  # Separate source, not extra tables on olist_raw above, because that source
  # carries an `external_location` that reads CSVs in place. These are real
  # warehouse tables written by the enrichment pipeline, so they must not
  # inherit it. Same schema on both engines.
  - name: olist_enrichment
    description: >
      Aspect labels produced by enrichment/enrich.py. Populated by a live run,
      or for free from the committed snapshot with `make enrich-restore`.
    schema: "{{ env_var('BQ_RAW_DATASET', 'olist_raw') }}"
    tables:
      - name: review_enrichment
        description: >
          One row per (review text, prompt version, model), keyed by content_hash.
          Holds several runs at once; the marts read only the shipped one.
        columns:
          - name: content_hash
            description: sha256 of text + prompt version + model. The cache key.
            data_tests: [unique, not_null]
          - name: prompt_version
            data_tests: [not_null]
          - name: model
            data_tests: [not_null]
      - name: review_enrichment_map
        description: >
          review_id -> content_hash. Keyed on BOTH columns: a review has one
          result per (prompt version, model), not one result outright, and the
          single-column key silently overwrote the first run's mapping.
        columns:
          - name: review_id
            data_tests: [not_null]
          - name: content_hash
            data_tests: [not_null]
