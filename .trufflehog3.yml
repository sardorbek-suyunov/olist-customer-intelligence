# Secret scanning config. Run by `make secrets` and by CI on every push.
#
# INSTALL IT IN ISOLATION. trufflehog3 3.0.10 pins `attrs==20.3.0`, which is
# five years old and incompatible with the `jsonschema` that dbt depends on.
# Installing it into this project's environment silently downgrades attrs and
# every subsequent `dbt` command dies with ModuleNotFoundError: No module named
# 'attrs' -- a traceback that names dbt and jsonschema and never mentions the
# scanner that caused it.
#
# So `make secrets` runs it through pipx, and CI runs it in its own job on a
# fresh runner that never installs requirements.txt. Do not add it to
# requirements.txt: the pin is not satisfiable alongside dbt.
#
# The scan covers the FULL commit history, not the working tree, because a
# secret that was committed and then deleted is still in the pack and still
# reachable by anyone who clones. CI checks out with fetch-depth: 0 for the
# same reason -- a shallow clone would scan one commit and report clean.
#
# Verified to actually fail: a throwaway repo with a planted AWS key and a
# Gemini-shaped key, committed and then deleted, is flagged in history. A
# scanner reporting zero and a scanner that is not working look identical from
# the outside, so that check is worth repeating if this config changes.
#
# ---------------------------------------------------------------------------
# EXCLUSIONS
# ---------------------------------------------------------------------------
# Kept to the minimum. Excluding paths from a secret scanner is how secrets get
# missed, and a scanner that cries wolf on generated data teaches people to
# ignore it -- which is the same outcome by a slower route.
#
# Both entries below are GENERATED files, regenerated by `make profile` and
# `make enrich-export` from source data. A credential cannot be introduced into
# them by hand without also changing the generator, which is not excluded. They
# are here because they contain high-entropy strings by construction: sha256
# content hashes and normalized text pairs.
exclude:
  - message: Generated parity seed - normalized location strings, no credentials
    paths:
      - transform/seeds/normalization_parity\.csv

  - message: Generated enrichment snapshot - sha256 content hashes by design
    paths:
      - enrichment/data/.*\.parquet
      - dashboard/data/.*\.parquet
