# Secret scanning config. Run by `make secrets` and by CI on every push.
#
# INSTALL IT IN ISOLATION. trufflehog3 3.0.10 pins `attrs==20.3.0`, which is
# five years old and incompatible with the `jsonschema` that dbt depends on.
# Installing it into this project's environment silently downgrades attrs and
# every subsequent `dbt` command dies with ModuleNotFoundError: No module named
# 'attrs' -- a traceback that names dbt and jsonschema and never mentions the
# scanner that caused it.
#
# So `make secrets` runs it through pipx, and CI runs it in its own job on a
# fresh runner that never installs requirements.txt. Do not add it to
# requirements.txt: the pin is not satisfiable alongside dbt.
#
# The scan covers the FULL commit history, not the working tree, because a
# secret that was committed and then deleted is still in the pack and still
# reachable by anyone who clones. CI checks out with fetch-depth: 0 for the
# same reason -- a shallow clone would scan one commit and report clean.
#
# Verified to actually fail: a throwaway repo with a planted AWS key and a
# Gemini-shaped key, committed and then deleted, is flagged in history. A
# scanner reporting zero and a scanner that is not working look identical from
# the outside, so that check is worth repeating if this config changes.
#
# ---------------------------------------------------------------------------
# EXCLUSIONS
# ---------------------------------------------------------------------------
# Kept to the minimum. Excluding paths from a secret scanner is how secrets get
# missed, and a scanner that cries wolf on generated data teaches people to
# ignore it -- which is the same outcome by a slower route.
#
# Every entry below is a GENERATED file, regenerated from source data by
# `make profile`, `make enrich-export` or `make diagram`. A credential cannot be
# introduced into one by hand without also changing the generator, which is not
# excluded. They are here because they contain high-entropy strings by
# construction: sha256 content hashes, normalized text pairs, and SVG geometry.
#
# `paths` ARE GLOBS, NOT REGULAR EXPRESSIONS. trufflehog3 matches each entry with
# pathlib.Path.match, so `foo/.*\.csv` matches a file literally named that and
# nothing else. Both original entries here were written as regexes and therefore
# never excluded anything -- which nobody noticed, because neither file had yet
# produced a finding. The config was dead and looked identical to config that
# works, right up until docs/img/architecture.svg turned it red.
#
# Measured, on the same full-history scan, same command as CI: the committed
# regex form produced 52 findings and this glob form produces 0. That is the
# check worth repeating if these lines are ever edited -- an exclusion that
# silently matches nothing is indistinguishable from one that works, until the
# day a generated file trips a rule.
exclude:
  - message: Generated parity seed - normalized location strings, no credentials
    paths:
      - transform/seeds/normalization_parity.csv

  - message: Generated enrichment snapshot - sha256 content hashes by design
    paths:
      - enrichment/data/*.parquet
      - dashboard/data/*.parquet

  # Rendered from docs/architecture.mmd by `make diagram`. Flagged MEDIUM for
  # High Entropy: mermaid emits minified CSS and long path coordinate strings,
  # which look like entropy and are geometry. The SOURCE is not excluded, so a
  # credential could not reach this file without appearing in a .mmd diff first
  # -- and analytics/tests/test_architecture_diagram.py asserts the two agree.
  - message: Rendered diagram - minified CSS and SVG path data, no credentials
    paths:
      - docs/img/architecture.svg

  # The committed `terraform plan` output. Flagged MEDIUM for High Entropy on
  # the quota-override resource ids -- `Cg1RdW90YU92ZXJyaWRl` is base64 for the
  # protobuf label "QuotaOverride", not a credential -- and on the URL-encoded
  # metric paths beside them. The .tf SOURCE is not excluded, so nothing can
  # reach this file without appearing in a Terraform diff first, and a plan
  # redacts values marked sensitive in any case.
  - message: Generated terraform plan - base64 resource ids and URL-encoded metric paths
    paths:
      - infra/terraform/PLAN.txt
